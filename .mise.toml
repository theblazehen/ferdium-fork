[tools]
# FORK: Keep local tasks aligned with upstream's engine-strict toolchain.
node = "24.20.0"
pnpm = "12.3.4"

[tasks.dev]
description = "Start esbuild watcher + electron with CDP debugging"
run = """
pnpm run dev &
DEV_PID=$!
sleep 3
FERDIUM_CDP=1 pnpm start
kill $DEV_PID 2>/dev/null
"""

[tasks.build]
description = "Build unpacked linux dir"
run = "pnpm run build -- --linux dir"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "pnpm run typecheck"

[tasks.lint]
description = "Run ESLint"
run = "pnpm run lint"

[tasks.test]
description = "Run jest tests"
run = "pnpm run test"
